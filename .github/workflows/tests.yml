name: Tests

# Runs the SDMLX contract tests on every push and pull request.
# GitHub's Linux machines have no Apple GPU, so MLX runs on the CPU here.
# All tests in tests/ check logic and contracts only and pass that way;
# image generation itself is still only testable on a Mac.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMFYUI_VERSION: v0.41.2

jobs:
  tests:
    name: Contract tests (Linux, MLX on CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          ref: ${{ env.COMFYUI_VERSION }}
          path: ComfyUI

      - name: Check out SDMLX
        uses: actions/checkout@v4
        with:
          path: ComfyUI/custom_nodes/SDMLX

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt
          # insightface and onnxruntime are only needed for FaceID nodes, not for the tests.
          grep -vE '^(mlx|insightface|onnxruntime)' ComfyUI/custom_nodes/SDMLX/requirements.txt > sdmlx-test-requirements.txt
          pip install "mlx[cpu]" toml -r sdmlx-test-requirements.txt

      - name: Run tests
        working-directory: ComfyUI/custom_nodes
        env:
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
          COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
        run: python SDMLX/.github/scripts/run_tests.py
