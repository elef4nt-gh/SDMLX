name: Registry Metadata Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/registry_metadata_cleanup.yml"

jobs:
  cleanup-registry-metadata:
    name: Cleanup Registry Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Clear stale accelerator metadata and deprecate broken versions
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["REGISTRY_ACCESS_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None, allowed_errors=None):
              allowed_errors = set(allowed_errors or [])
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if exc.code in allowed_errors:
                      return {"allowed_error": exc.code, "body": body}
                  raise RuntimeError(f"{method} {url} failed: HTTP {exc.code}: {body}") from exc

          node_url = "https://api.comfy.org/publishers/elef4nt/nodes/sdmlx"
          node = request("GET", "https://api.comfy.org/nodes/sdmlx")
          node["supported_accelerators"] = []
          node["supported_os"] = ["MacOS"]
          request("PUT", node_url, node)

          versions = request("GET", "https://api.comfy.org/nodes/sdmlx/versions")
          version_ids = {entry.get("version"): entry.get("id") for entry in versions}
          for version, message in {
              "0.1.0": "Deprecated immediately after publishing because dependencies were not captured by the initial registry upload. Please use 0.1.2 or newer.",
              "0.1.1": "Deprecated because the Apple Metal accelerator classifier caused false conflict warnings in ComfyUI Desktop. Please use 0.1.2 or newer.",
          }.items():
              version_id = version_ids.get(version) or version
              version_url = f"https://api.comfy.org/publishers/elef4nt/nodes/sdmlx/versions/{version_id}"
              result = request("DELETE", version_url, allowed_errors={401, 404, 405})
              if result.get("allowed_error") == 404:
                  print(f"{version} already deleted.")
                  continue
              if result.get("allowed_error"):
                  request(
                      "PUT",
                      f"https://api.comfy.org/publishers/elef4nt/nodes/sdmlx/versions/{version}",
                      {"deprecated": True, "changelog": message},
                  )
                  print(f"{version} could not be deleted by API; deprecated instead.")
              else:
                  print(f"{version} deleted.")

          print("Registry metadata cleanup complete.")
          PY
